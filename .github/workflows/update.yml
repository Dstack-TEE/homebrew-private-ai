name: Update stable release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      # Events created with GITHUB_TOKEN start no workflows, so an update PR
      # opened with it never ran the tests. A GitHub App token lets the push
      # and the pull request run test.yml.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DESKTOP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Read the stable version
        id: release
        run: echo "version=$(python3 scripts/update.py --print-version)" >> "$GITHUB_OUTPUT"
      - name: Switch to the release branch
        env:
          BRANCH: automation/private-ai-proxy-${{ steps.release.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
      - name: Generate Formula and Cask
        run: python3 scripts/update.py
      - name: Commit an update
        id: commit
        env:
          BRANCH: automation/private-ai-proxy-${{ steps.release.outputs.version }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git diff --quiet -- Formula/private-ai-proxy.rb Casks/private-ai-proxy.rb; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Formula/private-ai-proxy.rb Casks/private-ai-proxy.rb
            git commit -m "private-ai-proxy $VERSION"
            git push --set-upstream origin "$BRANCH"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet origin/main HEAD -- Formula/private-ai-proxy.rb Casks/private-ai-proxy.rb; then
            echo "pr=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the update pull request
        if: steps.commit.outputs.pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: automation/private-ai-proxy-${{ steps.release.outputs.version }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "private-ai-proxy $VERSION" \
              --body "Update the Formula and Cask from the versioned desktop-v$VERSION release and its published SHA256SUMS."
          fi
